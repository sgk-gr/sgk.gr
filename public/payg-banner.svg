<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800&amp;display=swap');
    .box-text-black { font-family: 'Inter', 'Arial', sans-serif; font-weight: 800; font-size: 72px; fill: #111111; letter-spacing: -1px; }
    .box-text-white { font-family: 'Inter', 'Arial', sans-serif; font-weight: 800; font-size: 72px; fill: #ffffff; letter-spacing: -1px; }
  </style>
  <rect width="800" height="800" fill="#ffffff" />
  
  <!-- Group to center everything -->
  <g transform="translate(150, 280)">
    <!-- Green Box -->
    <rect x="0" y="0" width="340" height="120" fill="#86efac" />
    <text x="40" y="85" class="box-text-black">Pay as</text>

    <!-- Blue Box -->
    <rect x="0" y="120" width="500" height="120" fill="#3b5bdb" />
    <text x="40" y="205" class="box-text-white">you grow</text>
  </g>
</svg>
