name: Daily Auto Campaigns (400 Emails)

on:
  schedule:
    # Runs every day at 06:32 UTC (09:32 AM Greek time - 2 min after Vercel Cron as guaranteed backup)
    - cron: '32 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub anytime

jobs:
  run-daily-campaigns:
    name: Dispatch 400 Emails & Report to info@sgk.gr
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Trigger Daily 400 Campaigns API
        run: |
          echo "🚀 Triggering SGK Daily Campaigns (101 New IKE, 100 Legacy IKE, 100 FTTH, 99 Non-IKE)..."
          RESPONSE=$(curl -s --max-time 300 -X POST "https://www.sgk.gr/api/admin/cron-daily-campaigns" \
            -H "Content-Type: application/json" \
            -d '{"force": false, "source": "github_actions"}')
          echo "Server Response:"
          echo "$RESPONSE"
